<h2>Sales Order Detail</h2>

@if (salesOrderDetails()?.length > 0) {
  <div class="row">
    @for (detail of salesOrderDetails(); track detail) {
      <div class="col col-md-4">
        <app-sales-order-info
          [salesOrderDetail]="detail"></app-sales-order-info>
      </div>
    }
  </div>
}

@if (!salesOrderDetails() || salesOrderDetails().length === 0) {
  <div class="row">
    <div class="col col-md-12">No records found</div>
  </div>
}
